# Keeps the free Render demo awake from 9 AM to 8 PM India time.
#
# Render's free plan gives 750 hours a month across all free services. Keeping both services awake
# 11 hours a day uses about 700 of them, leaving a little for visits outside these hours. Keeping
# them awake around the clock would run out mid-month, and Render then suspends both until the 1st.
#
# A free service sleeps after 15 minutes without traffic, and GitHub can start scheduled runs a few
# minutes late, so this pings every 5 minutes. The last ping is at 7:55 PM; both sleep by about 8:10 PM.
# GitHub turns off schedules in a public repo after 60 days without any commits.
name: Keep demo awake

on:
  schedule:
    - cron: '*/5 9-19 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the API and the website
        run: |
          for url in https://carsales-demo-api.onrender.com/api/health/live https://carsales-demo-web.onrender.com/login; do
            # A sleeping service can take about a minute to answer.
            if ! curl --silent --show-error --fail --max-time 120 --retry 2 --retry-delay 15 \
                 -o /dev/null -w "$url -> %{http_code} in %{time_total}s\n" "$url"; then
              echo "::warning::$url did not answer"
            fi
          done
